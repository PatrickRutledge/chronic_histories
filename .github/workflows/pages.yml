# Publishes the record index and every record's pages to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          git ls-files 'cases/*/generated/*' 'pilots/*/generated/*' \
            'cases/*/case.json' 'pilots/*/case.json' \
            'cases/*/sources.md' 'pilots/*/sources.md' \
            | tar -cf - -T - | tar -xf - -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
